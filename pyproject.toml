# pyproject.toml

[build-system]
requires = ["setuptools>=61.0", "wheel", "cffi"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrats_tls"
version = "0.1.0"
description = "Python bindings for RATS-TLS (Remote Attestation over TLS)"
authors = [
  { name="Simon Jonsson", email="snowier_unfazed.9h@icloud.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/simonjonsson87/pyrats_tls"

[tool.setuptools]
package-dir = {"pyrats_tls"= "pyrats_tls"}
packages = ["pyrats_tls"]

[tool.setuptools.package-data]
"pyrats_tls" = ["*.so", "*.dylib", "*.dll"]