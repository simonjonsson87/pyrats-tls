name: Build Wheels

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: macos-latest
            architecture: arm64
          - os: windows-latest
            architecture: x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: 'pip'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.23.3

      - name: Build wheels
        run: |
          cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_CONFIG_SETTINGS: |
            bdist_wheel.plat-name=macosx_11_0_universal2
            bdist_wheel.plat-name=manylinux_2_17_x86_64
            bdist_wheel.plat-name=win_amd64
          CIBW_ENVIRONMENT_LINUX: >
            LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
            PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          CIBW_ENVIRONMENT_MACOS: >
            DYLD_LIBRARY_PATH="/usr/local/lib:/opt/homebrew/opt/openssl@3/lib:/opt/homebrew/opt/libcbor/lib:/opt/homebrew/opt/libfido2/lib:$DYLD_LIBRARY_PATH"
            PKG_CONFIG_PATH="/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/libcbor/lib/pkgconfig:/opt/homebrew/opt/libfido2/lib/pkgconfig:$PKG_CONFIG_PATH"
            OPENSSL_DIR="/opt/homebrew/opt/openssl@3"
            LIBCBOR_DIR="/opt/homebrew/opt/libcbor"
            LIBFIDO2_DIR="/opt/homebrew/opt/libfido2"
          CIBW_ENVIRONMENT_WINDOWS: >
            PATH="C:/rats-tls/bin;C:/Program Files/OpenSSL-Win64/bin;$PATH"
          CIBW_BEFORE_BUILD_LINUX: |
            apt-get update && apt-get install -y git make autoconf libtool gcc g++ libssl-dev libcbor-dev libfido2-dev pkg-config
            git clone https://github.com/inclavare-containers/rats-tls.git
            cd rats-tls
            cmake -B build \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DTLS_TYPE=openssl \
              -DWITH_SGX=OFF \
              -DWITH_SEV=ON \
              -DOPENSSL_USE_STATIC_LIBS=ON \
              -DCMAKE_PREFIX_PATH="/usr;/usr/local" \
              --trace-expand
            sudo cmake --build build --target install
            mkdir -p ../pyrats_tls
            ls -l /usr/local/lib/librats_tls.so || { echo "Error: librats_tls.so not found"; exit 1; }
            cp /usr/local/lib/librats_tls.so ../pyrats_tls/
            cd ..
            pip install cmake ninja
          CIBW_BEFORE_BUILD_MACOS: |
            echo "=== Fetching OpenSSL path ==="
            OPENSSL_PREFIX=$(brew --prefix openssl@3) || { echo "Failed to get OpenSSL prefix"; exit 1; }
            echo "OPENSSL_PREFIX=$OPENSSL_PREFIX"
            echo "=== Debugging OpenSSL Header ==="
            ls -l "$OPENSSL_PREFIX/include/openssl/opensslv.h" || { echo "OpenSSL header not found at $OPENSSL_PREFIX"; exit 1; }
            brew info openssl@3 || echo "Failed to get OpenSSL info"
            echo "=== Debugging pkg-config ==="
            export PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig:/opt/homebrew/opt/libcbor/lib/pkgconfig:/opt/homebrew/opt/libfido2/lib/pkgconfig:$PKG_CONFIG_PATH"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            find "$OPENSSL_PREFIX" -name 'openssl.pc' || echo "openssl.pc not found"
            pkg-config --modversion openssl || echo "pkg-config cannot find OpenSSL"
            pkg-config --cflags --libs openssl || echo "pkg-config cannot provide OpenSSL flags"
            echo "=== Debugging permissions ==="
            ls -ld .. || echo "Cannot access project root"
            mkdir -p ../pyrats_tls || { echo "Cannot create ../pyrats_tls"; exit 1; }
            ls -ld ../pyrats_tls || echo "Cannot list ../pyrats_tls"
            echo "=== Installing dependencies ==="
            brew update --quiet
            brew install openssl@3 libcbor libfido2 pkg-config || brew reinstall openssl@3 libcbor libfido2 pkg-config
            echo "=== Verifying OpenSSL installation ==="
            ls -l "$OPENSSL_PREFIX/include/openssl/opensslv.h" || { echo "OpenSSL header still not found after install"; exit 1; }
            echo "=== Cloning rats-tls ==="
            git clone https://github.com/inclavare-containers/rats-tls.git
            cd rats-tls
            echo "=== Patching CMakeLists.txt for OpenSSL ==="
            sed -i '' '/find_package(OpenSSL REQUIRED)/a\
            if(NOT OPENSSL_FOUND)\n\
              find_package(PkgConfig REQUIRED)\n\
              pkg_check_modules(OPENSSL REQUIRED openssl)\n\
              set(OPENSSL_INCLUDE_DIR ${OPENSSL_INCLUDE_DIRS})\n\
              set(OPENSSL_LIBRARIES ${OPENSSL_LIBRARIES})\n\
            endif()' CMakeLists.txt
            echo "=== Debugging CMake include paths ==="
            grep -r "include_directories" . || echo "No include_directories found"
            echo "=== Debugging CMAKE_PREFIX_PATH ==="
            echo "CMAKE_PREFIX_PATH=$OPENSSL_PREFIX;/opt/homebrew/opt/libcbor;/opt/homebrew/opt/libfido2"
            cmake -B build \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DTLS_TYPE=openssl \
              -DWITH_SGX=OFF \
              -DOPENSSL_USE_STATIC_LIBS=ON \
              -DOPENSSL_DIR="$OPENSSL_PREFIX" \
              -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
              -DOPENSSL_LIBRARY_DIR="$OPENSSL_PREFIX/lib" \
              -DCMAKE_PREFIX_PATH="$OPENSSL_PREFIX;/opt/homebrew/opt/libcbor;/opt/homebrew/opt/libfido2" \
              -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
              -DCMAKE_VERBOSE_MAKEFILE=ON 
            echo "=== Checking CMake OpenSSL detection ==="
            cmake -LA | grep OPENSSL || echo "CMake did not detect OpenSSL"
            sudo cmake --build build --target install
            ls -l /usr/local/lib/librats_tls.dylib || { echo "Error: librats_tls.dylib not found"; exit 1; }
            cp /usr/local/lib/librats_tls.dylib ../pyrats_tls/
            cd ..
            pip install cmake ninja
          CIBW_BEFORE_BUILD_WINDOWS: |
            choco install git make openssl pkgconfiglite
            git clone https://github.com/inclavare-containers/rats-tls.git
            cd rats-tls
            cmake -G "Visual Studio 16 2019" -A x64 -B build \
              -DCMAKE_INSTALL_PREFIX=C:/rats-tls \
              -DTLS_TYPE=openssl \
              -DWITH_SGX=OFF \
              -DOPENSSL_USE_STATIC_LIBS=ON \
              -DOPENSSL_DIR="C:/Program Files/OpenSSL-Win64" \
              -DOPENSSL_INCLUDE_DIR="C:/Program Files/OpenSSL-Win64/include" \
              -DOPENSSL_LIBRARY_DIR="C:/Program Files/OpenSSL-Win64/lib" \
              -DCMAKE_PREFIX_PATH="C:/Program Files/OpenSSL-Win64"
            cmake --build build --config Release --target install
            mkdir -p ../pyrats_tls
            ls C:/rats-tls/bin/rats_tls.dll || { echo "Error: rats_tls.dll not found"; exit 1; }
            cp C:/rats-tls/bin/rats_tls.dll ../pyrats_tls/
            cd ..
            pip install cmake ninja
          CIBW_ARCHS_MACOS: "universal2"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: |
            delocate-wheel --require-archs universal2 -w {dest_dir} -v {wheel}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

      - name: Test wheels
        run: |
          pip install pytest
          pip install pyrats_tls --no-index --find-links=wheelhouse
          pytest tests/test_client.py -v
        env:
          LD_LIBRARY_PATH: /usr/local/lib:$LD_LIBRARY_PATH
          DYLD_LIBRARY_PATH: /usr/local/lib:/opt/homebrew/opt/openssl@3/lib:/opt/homebrew/opt/libcbor/lib:/opt/homebrew/opt/libfido2/lib:$DYLD_LIBRARY_PATH