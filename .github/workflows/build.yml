# build.yml

name: Build Wheels

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel --output-dir wheelhouse
        env:
          CIBW_SKIP: "pp* cp36* cp37*"
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT_LINUX: >
            LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          CIBW_ENVIRONMENT_MACOS: >
            DYLD_LIBRARY_PATH="/usr/local/lib:$DYLD_LIBRARY_PATH"
          CIBW_ENVIRONMENT_WINDOWS: >
            PATH="C:/rats-tls/bin;$PATH"
          CIBW_BEFORE_BUILD_LINUX: |
            apt-get update && apt-get install -y git make autoconf libtool gcc g++ libssl-dev libcbor-dev
            git clone https://github.com/inclavare-containers/rats-tls.git
            cd rats-tls
            cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local -DTLS_TYPE=openssl -DWITH_SGX=OFF -DWITH_SEV=ON
            cmake --build build --target install
            cp /usr/local/lib/librats_tls.so /project/pyrats_tls/
            cd ..
            pip install cmake ninja
          CIBW_BEFORE_BUILD_MACOS: |
            brew install openssl@3 cbor
            git clone https://github.com/inclavare-containers/rats-tls.git
            cd rats-tls
            cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local -DTLS_TYPE=openssl -DWITH_SGX=OFF
            cmake --build build --target install
            cp /usr/local/lib/librats_tls.dylib /project/pyrats_tls/
            cd ..
            pip install cmake ninja
          CIBW_BEFORE_BUILD_WINDOWS: |
            choco install git make openssl
            git clone https://github.com/inclavare-containers/rats-tls.git
            cd rats-tls
            cmake -G "Visual Studio 16 2019" -A x64 -B build -DCMAKE_INSTALL_PREFIX=C:/rats-tls -DTLS_TYPE=openssl -DWITH_SGX=OFF
            cmake --build build --config Release --target install
            cp C:/rats-tls/bin/rats_tls.dll /project/pyrats_tls/
            cd ..
            pip install cmake ninja

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

      - name: Test wheels
        run: |
          pip install pytest
          pip install pyrats_tls --no-index --find-links=wheelhouse
          pytest tests
        env:
          LD_LIBRARY_PATH: /usr/local/lib:$LD_LIBRARY_PATH  # Linux
          DYLD_LIBRARY_PATH: /usr/local/lib:$DYLD_LIBRARY_PATH  # macOS          