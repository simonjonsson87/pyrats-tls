# build.yml

name: Build Wheels

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: macos-latest
            architecture: arm64
          - os: windows-latest
            architecture: x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: 'pip'







      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.23.3

      - name: Build wheels
        run: |
          cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_CONFIG_SETTINGS: |
            bdist_wheel.plat-name=macosx_11_0_arm64
            bdist_wheel.plat-name=manylinux_2_17_x86_64
            bdist_wheel.plat-name=win_amd64
          CIBW_ENVIRONMENT_LINUX: >
            LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          CIBW_ENVIRONMENT_MACOS: >
            DYLD_LIBRARY_PATH="/usr/local/lib:/opt/homebrew/opt/openssl@3/lib:/opt/homebrew/opt/libcbor/lib:/opt/homebrew/opt/libfido2/lib:$DYLD_LIBRARY_PATH"
            OPENSSL_DIR="/opt/homebrew/opt/openssl@3"
            LIBCBOR_DIR="/opt/homebrew/opt/libcbor"
          CIBW_ENVIRONMENT_WINDOWS: >
            PATH="C:/rats-tls/bin;$PATH"
          CIBW_BEFORE_BUILD_LINUX: |
            apt-get update && apt-get install -y git make autoconf libtool gcc g++ libssl-dev libcbor-dev libfido2-dev
            git clone https://github.com/inclavare-containers/rats-tls.git
            cd rats-tls
            cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local -DTLS_TYPE=openssl -DWITH_SGX=OFF -DWITH_SEV=ON -DOPENSSL_USE_STATIC_LIBS=ON
            sudo cmake --build build --target install
            mkdir -p /project/pyrats_tls
            cp /usr/local/lib/librats_tls.so /project/pyrats_tls/
            cd ..
            pip install cmake ninja
          CIBW_BEFORE_BUILD_MACOS: |
            echo "Updating Homebrew..."
            brew update --quiet

            echo "Installing openssl@3, libcbor, and libfido2..."
            brew install openssl@3 libcbor libfido2

            # Make OpenSSL visible to CMake
            export LDFLAGS="-L/opt/homebrew/opt/openssl@3/lib"
            export CPPFLAGS="-I/opt/homebrew/opt/openssl@3/include"
            export PKG_CONFIG_PATH="/opt/homebrew/opt/openssl@3/lib/pkgconfig"

            echo "Cloning rats-tls..."
            git clone https://github.com/inclavare-containers/rats-tls.git
            cd rats-tls

            echo "Configuring rats-tls with CMake..."
            cmake -B build \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DTLS_TYPE=openssl \
              -DWITH_SGX=OFF \
              -DOPENSSL_USE_STATIC_LIBS=ON

            echo "Building and installing rats-tls..."
            sudo cmake --build build --target install

            # Back to the root of your Python project
            cd ..

            echo "Copying librats_tls.dylib into the Python package..."
            mkdir -p pyrats_tls/
            cp /usr/local/lib/librats_tls.dylib pyrats_tls/

            echo "Installing CMake and Ninja for any Python-side build steps..."
            pip install cmake ninja
          CIBW_BEFORE_BUILD_WINDOWS: |
            choco install git make openssl
            git clone https://github.com/inclavare-containers/rats-tls.git
            cd rats-tls
            cmake -G "Visual Studio 16 2019" -A x64 -B build -DCMAKE_INSTALL_PREFIX=C:/rats-tls -DTLS_TYPE=openssl -DWITH_SGX=OFF -DOPENSSL_USE_STATIC_LIBS=ON
            cmake --build build --config Release --target install
            mkdir -p /project/pyrats_tls
            cp C:/rats-tls/bin/rats_tls.dll /project/pyrats_tls/
            cd ..
            pip install cmake ninja

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

      - name: Test wheels
        run: |
          pip install pytest
          pip install pyrats_tls --no-index --find-links=wheelhouse
          pytest tests
        env:
          LD_LIBRARY_PATH: /usr/local/lib:$LD_LIBRARY_PATH
          DYLD_LIBRARY_PATH: /usr/local/lib:/opt/homebrew/opt/openssl@3/lib:/opt/homebrew/opt/libcbor/lib:/opt/homebrew/opt/libfido2/lib:$DYLD_LIBRARY_PATH